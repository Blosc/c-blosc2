name: CI Fuzz
on:
  push:
    paths-ignore:
      - 'doc/**'
      - 'bench/**'
      - 'examples/**'
      - '**.md'
      - '**.rst'
      - 'RELEASE_NOTES.*'
      - 'ANNOUNCE.*'
      - 'THANKS.*'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'bench/**'
      - 'examples/**'
      - '**.md'
      - '**.rst'
      - 'RELEASE_NOTES.*'
      - 'ANNOUNCE.*'
      - 'THANKS.*'
jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
      with:
        oss-fuzz-project-name: 'c-blosc2'
        dry-run: false

    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
      with:
        oss-fuzz-project-name: 'c-blosc2'
        fuzz-seconds: 120
        dry-run: false

    - name: Upload Crash
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: artifacts
        path: ./out/artifacts
